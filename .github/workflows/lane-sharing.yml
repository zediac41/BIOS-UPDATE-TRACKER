name: Check new board research

on:
  pull_request:
    paths:
      - config.yml
      - lane_sharing.yml
      - lane_sharing.py
      - .github/workflows/lane-sharing.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install research data reader
        run: python -m pip install PyYAML

      - name: Check research for added boards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python lane_sharing.py --check-new "$BASE_SHA"
